<style>

.lk{color:var(--p);text-align:center}
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}.stc{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:16px;display:flex;flex-direction:column}.stc b{font-size:34px}.stc small:first-child{letter-spacing:.12em}
.ar{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}.ar img{width:34px;height:50px;object-fit:cover;border-radius:6px}.ar b{flex:1}.ar a{color:var(--p)}
.ov{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--b)}td a{color:var(--p);margin-right:8px}
.pvw{display:none;max-width:140px;border-radius:12px}.tg{flex-direction:row!important;justify-content:space-between;align-items:center}.tg input{display:none}.tg i{width:46px;height:26px;border-radius:99px;background:#27272F;position:relative;transition:.3s}.tg i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.3s}.tg input:checked+i{background:var(--p)}.tg input:checked+i:after{left:23px}

.yt{background:#ff0033}.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4)}.tgm{background:#229ED9}

</style></head><body>
<div id=sp><img src="logo.png" alt=""><i></i></div>
<header><a href="#/"><img class=logo src="logo.png" alt=ANIDUVIA></a>

<div class=sp></div><div class=sbox><input id=q placeholder="Search anime…" autocomplete=off><div class=sg></div></div>
<button class=ib id=pb></button><button class="ib hm" onclick="$('#dr').classList.toggle('on')">☰</button></header>
<div id=dr></div><main id=app></main><footer id=ft></footer><div id=md></div><div id=ts></div>
<script>
const C={URL:'PASTE_SUPABASE_URL',KEY:'PASTE_SUPABASE_ANON_KEY',L:{yt:'https://youtube.com/@aniduviastudio',ig:'https://www.instagram.com/aniduvia.studio',tg:'https://t.me/aniduviastudio'}};
const sb=supabase.createClient(C.URL,C.KEY),$=s=>document.querySelector(s),app=$('#app');
let me=null,P=null,A=[],W=new Set(),tm,hx=0,hp=0,hi,cur=[],eid=null,xid=null,XC={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22600%22%3E%3Crect fill=%22%23181820%22 width=%22400%22 height=%22600%22/%3E%3C/svg%3E";
const im=(u,c='')=>`<img class="${c}" loading=lazy src="${esc(u||PH)}" onerror="this.onerror=null;this.src='${PH}'">`;
const toast=m=>{const t=$('#ts');t.textContent=m;t.className='on';clearTimeout(tm);tm=setTimeout(()=>t.className='',2800)};
const isA=()=>P&&['admin','owner'].includes(P.role);

$('#ft').innerHTML=socials()+'<p>© ANIDUVIA Studio</p>';
const sh=()=>navigator.share?navigator.share({url:location.href}):(navigator.clipboard.writeText(location.href),toast('Link copied'));
/* ---------- auth ---------- */
function auth(){$('#md').innerHTML=`<div class=mb onclick="if(event.target==this)this.remove()"><div class=bx><h3>Welcome to ANIDUVIA</h3><button class="bt g" onclick="sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}})">Continue with Google</button><input id=em type=email placeholder=Email><input id=pw type=password placeholder=Password><button class=bt onclick="ea('in')">Log in</button><button class="bt o" onclick="ea('up')">Sign up</button><a class=lk onclick=rp()>Forgot password?</a></div></div>`}
async function ea(m){const e=$('#em').value,p=$('#pw').value;const r=m=='in'?await sb.auth.signInWithPassword({email:e,password:p}):await sb.auth.signUp({email:e,password:p});if(r.error)return toast(r.error.message);toast(r.data.session?'Welcome!':'Check your email to confirm');if(r.data.session)$('#md').innerHTML=''}
async function rp(){const e=$('#em').value;if(!e)return toast('Enter your email first');const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.href.split('#')[0]});toast(r.error?r.error.message:'Reset link sent to your email')}

function bs(i){i.oninput=()=>{const n=i.value.toLowerCase().trim(),g=i.nextElementSibling;if(!n)return g.innerHTML='';g.innerHTML=A.filter(a=>a.published&&[a.title,a.alt_title].join(' ').toLowerCase().includes(n)).slice(0,6).map(a=>`<a href="#/a/${a.id}" onclick="this.parentNode.innerHTML=''">${im(a.poster)}<span>${esc(a.title)}</span></a>`).join('')};i.onkeydown=e=>{if(e.key=='Enter'&&i.value.trim()){i.nextElementSibling.innerHTML='';location.hash='#/s/'+encodeURIComponent(i.value.trim())}}}
/* ---------- data & router ---------- */
async function loadA(){const{data}=await sb.from('anime').select('*').order('created_at',{ascending:false});A=data||[]}
const rv=()=>{const o=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&(e.target.classList.add('in'),o.unobserve(e.target))),{threshold:.1});document.querySelectorAll('.rv').forEach(x=>o.observe(x))};
async function R(){clearInterval(hi);$('#dr').classList.remove('on');scrollTo(0,0);const[,r,a]=(location.hash.slice(1)||'/').split('/').map(decodeURIComponent);
try{if(!r)await home();else if(r=='a')await detail(a);else if(r=='w')await watch(a);else if(r=='s')browse(a||'');else if(r=='g')browse('',a);else if(r=='t')browse('','',a);else if(r=='wish')wish();else if(r=='me')await prof();else if(r=='admin')await admin();else app.innerHTML='<p class=w>Page not found</p>'}catch(e){app.innerHTML=`<p class=w>Something went wrong: ${esc(e.message)}</p>`}rv()}

/* ---------- home ---------- */
const cd=(a,i)=>`<a class=card href="#/a/${a.id}">${im(a.poster)}${i!=null?`<em class=rk>${i+1}</em>`:''}<span class=rt>★ ${a.rating??'–'}</span><div class=ct><b>${esc(a.title)}</b><small>${a.year||''} · ${a.type} · ${esc((a.genres||[])[0]||'')}</small></div></a>`;

const hero=f=>f.length?`<section class=hero onmouseenter="hp=1" onmouseleave="hp=0" ontouchstart="hp=1" ontouchend="setTimeout(()=>hp=0,4000)">${f.map((a,i)=>`<div class="sl${i?'':' on'}">${im(a.background||a.poster,'bgi')}<div class=hc><span class=pill>FEATURED SPOTLIGHT</span><h1>${esc(a.title)}</h1><div class=chips><span class=chip>${a.type}</span><span class=chip>${a.status}</span>${a.dub?'<span class=chip>Hindi dub by Aniduvia</span>':''}<span class=chip>★ ${a.rating??'–'}</span></div><p>${esc(a.synopsis)}</p><div class=bs><a class=bt href="#/a/${a.id}">▶ Watch Now</a><a class="bt o" href="#/a/${a.id}">ⓘ View Details</a></div></div></div>`).join('')}<div class=hn><button class=ib onclick=hg(-1)>‹</button><button class=ib onclick=hg(1)>›</button><span id=dt>${f.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</span></div></section>`:'';
function hg(d){const s=document.querySelectorAll('.sl'),t=document.querySelectorAll('#dt i');if(!s.length)return;s[hx].classList.remove('on');t[hx].classList.remove('on');hx=(hx+d+s.length)%s.length;s[hx].classList.add('on');t[hx].classList.add('on')}
async function home(){const p=A.filter(a=>a.published);let f=p.filter(a=>a.featured).sort((x,y)=>(x.featured_order||0)-(y.featured_order||0));if(!f.length)f=p.slice(0,4);let cw='';
